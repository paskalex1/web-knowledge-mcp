version: "3.9"

services:
  web-knowledge-mcp:
    build: .
    container_name: web-knowledge-mcp
    ports:
      - "8011:8000"
    environment:
      - WEB_KNOWLEDGE_PORT=8000
    networks:
      - mcp-net
    restart: unless-stopped

networks:
  mcp-net:
    external: true
    name: command_center_mcp-net
