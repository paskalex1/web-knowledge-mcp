[project]
name = "web-knowledge-mcp"
version = "0.1.0"
requires-python = ">=3.10"

dependencies = [
    "mcp>=0.1.0",
    "httpx>=0.27.0",
    "duckduckgo_search>=6.2.0",
    "beautifulsoup4>=4.12.0",
    "readability-lxml>=0.8.1",
    "lxml_html_clean>=0.1.0",
    "markdownify>=0.12.0",
    "pypdf>=4.0.0",
    "langdetect>=1.0.9",
    "fpdf2>=2.7.0",
]

[project.scripts]
web-knowledge-mcp = "web_knowledge_mcp.server:main"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"
